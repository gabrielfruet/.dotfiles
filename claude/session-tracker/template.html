<meta charset="utf-8">
<title>Session Juggling</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,500;1,8..60,400&display=swap">
<style>
/* Two tabs. Summary: Claude's read of the latest day, fixed 30-min window / limit 3.
   Advanced: the same data, interactive (window, limit, any day in range). */
:root {
  --bg: #faf9f5; --ink: #141413; --muted: #6b6a65; --faint: #a3a199; --line: #e8e6dc;
  --paper: #f3f1ea; --wash: #f1efe8; --neutral: #cfccc1; --clay: #d97757; --tip-bg: #141413; --tip-ink: #faf9f5;
  --good: #0ca30c; --warn: #fab219; --bad: #d03b3b;
  --k-build: #2a78d6; --k-review: #eb6834; --k-research: #1baf7a; --k-plan: #8a55c8; --k-ops: #e87ba4;
  --f-serif: "Source Serif 4", Georgia, serif;
  --f-body: "Inter", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #1f1e1d; --ink: #f0eee6; --muted: #a8a69e; --faint: #77756e; --line: #34332f;
    --paper: #2a2927; --wash: #262523; --neutral: #55534d; --tip-bg: #f0eee6; --tip-ink: #1f1e1d;
    --k-build: #3987e5; --k-review: #d95926; --k-research: #199e70; --k-plan: #9a6ad6; --k-ops: #d55181;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #1f1e1d; --ink: #f0eee6; --muted: #a8a69e; --faint: #77756e; --line: #34332f;
  --paper: #2a2927; --wash: #262523; --neutral: #55534d; --tip-bg: #f0eee6; --tip-ink: #1f1e1d;
  --k-build: #3987e5; --k-review: #d95926; --k-research: #199e70; --k-plan: #9a6ad6; --k-ops: #d55181;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html { scrollbar-gutter: stable; } /* switching tabs must not shift the page sideways */
body {
  margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.6 var(--f-body); -webkit-font-smoothing: antialiased;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.wrap { max-width: 760px; margin: 0 auto; padding: 40px 0 80px; } /* one width for both tabs */
nav { display: flex; justify-content: space-between; align-items: baseline; font-size: 13px; color: var(--muted); margin-bottom: 52px; }
nav button { font: inherit; color: var(--muted); background: none; border: 0; padding: 0 0 4px; margin-left: 20px; cursor: pointer; }
nav button[aria-selected="true"] { color: var(--ink); border-bottom: 1.5px solid var(--clay); }
.eyebrow { font-size: 13px; color: var(--muted); }
.verdict { display: inline-flex; align-items: center; gap: 8px; font-size: 13px; color: var(--muted); }
.verdict i { width: 8px; height: 8px; border-radius: 50%; }
h1 { font-family: var(--f-serif); font-weight: 400; font-size: 34px; line-height: 1.25; letter-spacing: -.01em; margin: 10px 0 36px; text-wrap: balance; }
h2 { font-size: 13px; font-weight: 500; color: var(--muted); margin: 0 0 16px; display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
section { margin-top: 48px; }
.kpis { display: grid; grid-template-columns: repeat(var(--n, 4), 1fr); border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); }
.kpis div { padding: 18px 0; font-size: 12.5px; color: var(--muted); min-width: 0; }
.kpis div + div { padding-left: 18px; border-left: 1px solid var(--line); }
.kpis b { display: block; font-family: var(--f-serif); font-weight: 400; font-size: 26px; color: var(--ink); line-height: 1.2; margin-bottom: 2px; font-variant-numeric: tabular-nums; }
.levels { display: flex; gap: 2px; height: 12px; }
.levels span { border-radius: 2px; }
.lvkey { display: grid; grid-template-columns: repeat(5, 1fr); font-size: 12px; color: var(--muted); margin-top: 10px; font-variant-numeric: tabular-nums; }
.lvkey b { display: block; font-weight: 500; color: var(--ink); font-size: 13px; }
.sw::before, .lvkey span::before, .legend span::before { content: ""; display: inline-block; width: 8px; height: 8px; border-radius: 2px; margin-right: 6px; background: var(--c); }
.exp { background: var(--paper); border-radius: 10px; padding: 20px 22px; }
.exp .label { font-size: 12px; color: var(--muted); }
.exp .quote { font-family: var(--f-serif); font-style: italic; font-size: 17px; margin: 4px 0 14px; }
.exp p, .research p { font-family: var(--f-serif); font-size: 17px; line-height: 1.55; margin: 0 0 12px; }
.exp p:last-child { margin-bottom: 0; }
.research { border-left: 2px solid var(--clay); padding-left: 18px; }
.research .cite { font-size: 12px; color: var(--faint); }
.take { display: grid; grid-template-columns: 110px 1fr; row-gap: 18px; margin: 0; font-family: var(--f-serif); font-size: 17px; line-height: 1.55; }
.take dt { font: 500 12.5px/1.9 var(--f-body); color: var(--muted); display: flex; align-items: center; gap: 8px; }
.take dt::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--c); }
.take dd { margin: 0; }
.tasks .row { display: grid; grid-template-columns: 1fr 160px 60px; align-items: center; gap: 16px; padding: 9px 0; border-bottom: 1px solid var(--line); font-size: 14px; }
.tasks .grp + .row { border-top: 1px solid var(--line); }
.tasks .row > span:first-child { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tasks .bar { height: 6px; border-radius: 3px; background: var(--c); }
.num { font-variant-numeric: tabular-nums; }
.t { text-align: right; color: var(--muted); font-size: 13px; }
.sub { color: var(--faint); font-size: 12px; margin-left: 6px; }
.areas { display: flex; flex-wrap: wrap; gap: 4px 24px; font-size: 13px; color: var(--muted); margin-top: 12px; }
.areas b { color: var(--ink); font-weight: 500; font-variant-numeric: tabular-nums; }
.grp { display: flex; justify-content: space-between; font-size: 12.5px; font-weight: 500; color: var(--ink); margin: 22px 0 6px; }
.grp:first-of-type { margin-top: 0; }
.grp span + span { color: var(--muted); font-weight: 400; font-variant-numeric: tabular-nums; }
svg text.grp-label { fill: var(--muted); font-size: 11.5px; font-weight: 500; }
.terrain { margin: 4px 0 0; }
.terrain svg text { fill: var(--faint); font-size: 11px; }
.acts { display: grid; grid-template-columns: repeat(var(--n, 3), 1fr); margin: 18px 0 44px; }
.acts div { padding: 0 18px; font-size: 13.5px; line-height: 1.5; color: var(--muted); min-width: 0; }
.acts div:first-child { padding-left: 0; }
.acts div + div { border-left: 1px solid var(--line); }
.acts b { display: block; color: var(--ink); font-weight: 600; font-size: 13px; margin-bottom: 4px; font-variant-numeric: tabular-nums; }
.pending { color: var(--muted); font-size: 14px; background: var(--paper); border-radius: 10px; padding: 14px 18px; }
footer { margin-top: 56px; font-size: 12px; color: var(--faint); }

.controls { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 24px; }
.controls select { font: 500 13px var(--f-body); color: var(--ink); background: transparent; border: 0; border-bottom: 1px dotted var(--faint); padding: 0 2px; cursor: pointer; }
.arrows { display: inline-flex; gap: 16px; margin-right: 8px; }
.arrows button { font: 13px var(--f-body); color: var(--muted); background: none; border: 0; padding: 0; cursor: pointer; }
.arrows button:hover:not(:disabled) { color: var(--ink); }
.arrows button:disabled { opacity: .35; cursor: default; }
.seg button { font: inherit; color: var(--muted); background: none; border: 0; padding: 0 0 3px; margin-left: 14px; cursor: pointer; }
.seg button[aria-pressed="true"] { color: var(--ink); border-bottom: 1.5px solid var(--clay); }
.lvrow { display: grid; grid-template-columns: 110px 1fr 120px; gap: 16px; align-items: center; padding: 7px 0; border-bottom: 1px solid var(--line); font-size: 14px; }
.lvrow .bar { height: 8px; border-radius: 3px; }
svg { display: block; width: 100%; height: auto; overflow: visible; }
svg text { font: 11.5px var(--f-body); fill: var(--faint); }
svg text.lane { fill: var(--ink); font-size: 12.5px; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 18px; font-size: 12px; color: var(--muted); margin-top: 14px; }
table { width: 100%; border-collapse: collapse; font-size: 14px; }
th { text-align: left; font-weight: 500; font-size: 12px; color: var(--muted); padding: 0 0 10px; border-bottom: 1px solid var(--line); }
td { padding: 9px 8px 9px 0; border-bottom: 1px solid var(--line); }
td.t, th.t { text-align: right; padding-right: 0; padding-left: 12px; }
.dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; margin-right: 8px; vertical-align: 1px; }
.table-wrap { overflow-x: auto; }
details { margin-top: 56px; font-size: 14px; color: var(--muted); border-top: 1px solid var(--line); padding-top: 16px; }
summary { cursor: pointer; font-size: 13px; font-weight: 500; }
details p { max-width: 620px; }
#tip { position: fixed; pointer-events: none; background: var(--tip-bg); color: var(--tip-ink); font-size: 12px; line-height: 1.45; padding: 7px 10px; border-radius: 6px; max-width: 300px; z-index: 10; }
[hidden] { display: none !important; }

@media (max-width: 640px) {
  h1 { font-size: 27px; }
  .kpis { grid-template-columns: repeat(2, 1fr); }
  .kpis div:nth-child(odd) { padding-left: 0; border-left: 0; }
  .kpis div:nth-child(n+3) { border-top: 1px solid var(--line); }
  .lvkey { grid-template-columns: repeat(3, 1fr); row-gap: 8px; }
  .take { grid-template-columns: 1fr; row-gap: 4px; }
  .take dd { margin-bottom: 14px; }
  .tasks .row { grid-template-columns: 1fr 70px 56px; }
  .lvrow { grid-template-columns: 80px 1fr 96px; }
  .acts { grid-template-columns: 1fr; row-gap: 14px; }
  .acts div { padding: 0; }
  .acts div + div { border-left: 0; border-top: 1px solid var(--line); padding-top: 14px; }
}
</style>

<div class="wrap">
  <nav>
    <span>Session juggling</span>
    <span role="tablist"><button role="tab" id="tab-summary" aria-selected="true">Summary</button><button role="tab" id="tab-advanced" aria-selected="false">Advanced</button></span>
  </nav>

  <main id="summary"></main>

  <main id="advanced" hidden>
    <div class="eyebrow controls">
      <span class="arrows"><button id="prev">‹ Previous day</button><button id="next">Next day ›</button></span>
      <label>Window <select id="win"></select></label>
      <label>Limit <select id="limit"></select></label>
      <label>Show <select id="scope"></select></label>
    </div>
    <div class="verdict" id="day-verdict" style="margin-top:20px"></div>
    <h1 id="day-h"></h1>
    <div class="kpis" id="day-kpis"></div>
    <div class="areas" id="day-areas"></div>
    <section>
      <h2><span>Last <span id="ndays"></span> days</span><span style="font-weight:400">click a day</span></h2>
      <svg id="strip" role="img" aria-label="Engaged time per day, split by time within and above the limit"></svg>
      <div class="legend"><span style="--c:var(--neutral)">within limit</span><span style="--c:var(--bad)">above limit</span></div>
    </section>
    <section>
      <h2><span>Time spent with N tasks in flight</span><span style="font-weight:400">share of engaged time</span></h2>
      <div id="levels"></div>
    </section>
    <section>
      <h2><span>Tasks in flight, and when you touched each one</span></h2>
      <svg id="chart"></svg>
      <div class="legend" id="kinds"></div>
    </section>
    <section>
      <h2><span>Time per task</span><span class="seg"><button id="tbl-day" aria-pressed="true">This day</button><button id="tbl-all" aria-pressed="false">All days</button></span></h2>
      <div class="table-wrap"><table id="tbl"></table></div>
    </section>
    <details><summary>How this is measured</summary><div id="method"></div></details>
  </main>
</div>
<div id="tip" hidden></div>

<script>
const DATA = /*__DATA__*/null;
const MIN = 60000, NS = "http://www.w3.org/2000/svg";
const KIND_GROUP = { build: "build", review: "review", research: "research", investigate: "research",
  planning: "plan", comms: "plan", writing: "plan", ops: "ops", personal: "ops" };
const KIND_LABEL = { build: "Build", review: "Review", research: "Research", plan: "Plan & write", ops: "Ops & personal" };
const kindOf = t => KIND_GROUP[t.kind] || "build";
const kc = k => `var(--k-${k})`;
const AREAS = { work: "Work", other: "Other" };
const threads = Object.fromEntries(DATA.threads.map(t => [t.id, t]));
const S = DATA.summary || null;
const areaOf = t => threads[t].area === "work" ? "work" : "other";
const DEF = { win: 30, limit: 3 };

const store = {
  get(k, d) { try { const v = localStorage.getItem("sj:" + k); return v == null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem("sj:" + k, JSON.stringify(v)); } catch {} },
};
const pad = n => String(n).padStart(2, "0");
const dayKey = ms => { const d = new Date(ms); return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`; };
const dayStart = key => { const [y, m, d] = key.split("-").map(Number); return new Date(y, m - 1, d).getTime(); };
const hhmm = m => `${pad(Math.floor(m / 60) % 24)}:${pad(Math.floor(m % 60))}`;
const dur = min => { min = Math.round(min); if (min < 60) return `${min}m`; const h = Math.floor(min / 60), m = min % 60; return m ? `${h}h ${pad(m)}m` : `${h}h`; };
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const fmtDay = (key, o = { weekday: "long", month: "long", day: "numeric" }) => new Date(dayStart(key)).toLocaleDateString("en", o);
const sizeOf = m => m < 10 ? "Quick" : m <= 45 ? "Focused" : "Deep";
const el = (tag, attrs, parent, text) => { const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); if (text != null) e.textContent = text; parent && parent.appendChild(e); return e; };

// Every human prompt is one engagement interval, filed under the day it was sent.
const byDay = {};
for (const s of DATA.sessions) for (const [a, b] of s.engage) (byDay[dayKey(b)] ||= []).push({ a, b, thread: s.thread });
for (const k in byDay) byDay[k].sort((x, y) => x.b - y.b);
const today = dayKey(DATA.generatedAt);
const allDays = [];
for (let i = DATA.days - 1; i >= 0; i--) { const d = new Date(dayStart(today)); d.setDate(d.getDate() - i); allDays.push(dayKey(d.getTime())); }
const activeDays = allDays.filter(k => byDay[k]);

// Minute grid for one day. count[m] = tasks touched in the trailing `win` minutes.
// A minute shared by k tasks gives each 1/k, so per-task times add up to engaged time.
// build.py day_stats() mirrors this; keep the two in step.
// scope "all" counts every task toward "in flight"; "work"/"other" look at one side only.
function computeDay(key, win, limit, scope = "all") {
  const evs = (byDay[key] || []).filter(e => scope === "all" || areaOf(e.thread) === scope), t0 = dayStart(key), N = 1440, order = [], cov = {};
  for (const e of evs) {
    if (!cov[e.thread]) { cov[e.thread] = new Uint8Array(N); order.push(e.thread); }
    const m0 = Math.max(0, Math.floor((e.a - t0) / MIN)), m1 = Math.min(N, Math.ceil((e.b - t0) / MIN));
    for (let m = m0; m < Math.max(m1, m0 + 1); m++) cov[e.thread][m] = 1;
  }
  const count = new Uint8Array(N), engaged = new Uint8Array(N), last = {};
  const stats = Object.fromEntries(order.map(t => [t, { thread: t, min: 0, visits: 0, iv: [] }]));
  for (let m = 0; m < N; m++) {
    let c = 0, here = 0;
    for (const t of order) { if (cov[t][m]) { last[t] = m; here++; } if (last[t] != null && m - last[t] < win) c++; }
    count[m] = c; engaged[m] = here ? 1 : 0;
    if (here) for (const t of order) if (cov[t][m]) stats[t].min += 1 / here;
  }
  let engagedMin = 0, overMin = 0, peak = 0, first = -1, lastM = -1;
  const levels = [0, 0, 0, 0, 0];
  for (let m = 0; m < N; m++) {
    if (!engaged[m]) continue;
    engagedMin++; if (first < 0) first = m; lastM = m;
    if (count[m] > limit) overMin++;
    peak = Math.max(peak, count[m]);
    levels[Math.min(Math.max(count[m], 1), 5) - 1]++;
  }
  let hops = 0, prev = null;
  for (const e of evs) {
    const s = stats[e.thread];
    if (e.thread !== prev) { s.visits++; if (prev) hops++; }
    s.iv.push([(e.a - t0) / MIN, (e.b - t0) / MIN]);
    prev = e.thread;
  }
  const areaMin = { work: 0, other: 0 };
  for (const t of order) areaMin[areaOf(t)] += stats[t].min;
  return { key, order, count, engaged, engagedMin, overMin, peak, first, last: lastM, hops, levels, stats, areaMin, win, limit, scope };
}
const cache = {};
const getDay = (k, w, l, sc = "all") => cache[`${k}|${w}|${l}|${sc}`] ||= computeDay(k, w, l, sc);
const areaLine = d => d.scope === "all"
  ? Object.keys(AREAS).map(a => `<span><b>${dur(d.areaMin[a])}</b> ${AREAS[a].toLowerCase()}</span>`).join("")
  : `<span>Showing ${AREAS[d.scope].toLowerCase()} tasks only</span>`;

function verdictOf(d) {
  const share = d.engagedMin ? d.overMin / d.engagedMin : 0;
  if (share < 0.15) return { text: "Within your limit", color: "var(--good)", share };
  if (share < 0.35) return { text: "Some extra juggling", color: "var(--warn)", share };
  return { text: "Hopped too much", color: "var(--bad)", share };
}
const levelColor = (n, limit) => n <= limit ? "var(--good)" : n === limit + 1 ? "var(--warn)" : "var(--bad)";
const levelLabel = i => `${i + 1}${i === 4 ? "+" : ""} at once`;
// Same four numbers on both tabs, so switching tabs never reshuffles the header.
const kpiRow = (d, v, limit) => [
  [dur(d.engagedMin), "with agents"], [d.order.length, "tasks touched"], [d.hops, "hops"],
  [`${Math.round(v.share * 100)}%`, `above ${limit} at once`],
].map(([b, l]) => `<div><b>${b}</b>${l}</div>`).join("");

// ---------- tooltip ----------
const tip = document.getElementById("tip");
function showTip(html, ev) {
  tip.innerHTML = html; tip.hidden = false;
  const r = tip.getBoundingClientRect();
  let x = ev.clientX + 12, y = ev.clientY + 12;
  if (x + r.width > innerWidth - 8) x = ev.clientX - r.width - 12;
  if (y + r.height > innerHeight - 8) y = ev.clientY - r.height - 12;
  tip.style.left = Math.max(8, x) + "px"; tip.style.top = Math.max(8, y) + "px";
}
const hideTip = () => { tip.hidden = true; };
const hover = (node, html) => { node.addEventListener("mousemove", e => showTip(typeof html === "function" ? html(e) : html, e)); node.addEventListener("mouseleave", hideTip); };

// ---------- summary ----------
function renderSummary() {
  const out = document.getElementById("summary");
  const key = S && byDay[S.day] ? S.day : activeDays[activeDays.length - 1];
  if (!key) { out.innerHTML = `<p class="pending">No sessions in the last ${DATA.days} days.</p>`; return; }
  const d = getDay(key, DEF.win, DEF.limit), v = verdictOf(d);
  const fresh = S && S.day === key;
  const rows = Object.values(d.stats).sort((a, b) => b.min - a.min);
  const groups = Object.keys(AREAS).map(a => {
    const rs = rows.filter(r => areaOf(r.thread) === a), rest = rs.slice(4);
    return { a, top: rs.slice(0, 4), rest, restMin: rest.reduce((s, r) => s + r.min, 0) };
  }).filter(g => g.top.length);
  const maxMin = Math.max(rows[0]?.min || 1, ...groups.map(g => g.restMin));
  const lv = d.levels, levelOp = [0.55, 0.75, 1, 1, 1];
  let h = `<div class="eyebrow">${esc(fmtDay(key))}${fresh && S.checkin ? ` · ${esc(S.checkin)}` : ""}</div>
    <div class="verdict" style="margin-top:20px"><i style="background:${v.color}"></i>${v.text}</div>
    <h1>${fresh && S.headline ? esc(S.headline) : `${Math.round(v.share * 100)}% of your time with agents ran above ${DEF.limit} tasks at once.`}</h1>
    <figure class="terrain"><svg id="terrain" role="img" aria-label="Tasks in flight across the day"></svg></figure>
    ${actsHtml(d)}
    <div class="kpis">${kpiRow(d, v, DEF.limit)}</div>
    <div class="areas">${areaLine(d)}</div>
    <section><h2><span>Time at each level</span></h2>
      <div class="levels">${lv.map((m, i) => m ? `<span style="flex:${m};background:${levelColor(i + 1, DEF.limit)};opacity:${i < DEF.limit ? levelOp[i] : 1}"></span>` : "").join("")}</div>
      <div class="lvkey">${lv.map((m, i) => `<span style="--c:${levelColor(i + 1, DEF.limit)}"><b>${dur(m)}</b>${levelLabel(i)}</span>`).join("")}</div>
    </section>`;
  if (!fresh) {
    h += `<section><p class="pending">Claude hasn't written its read of this day yet. It will at the next check-in.</p></section>`;
  } else {
    if (S.experiment) h += `<section><h2><span>Your experiment</span></h2><div class="exp">
        ${S.experiment.quote ? `<div class="label">${esc(S.experiment.source || "From your daily note")}</div><div class="quote">“${esc(S.experiment.quote)}”</div>` : ""}
        ${S.experiment.assessment ? `<p>${esc(S.experiment.assessment)}</p>` : ""}
        ${S.experiment.question ? `<p>${esc(S.experiment.question)}</p>` : ""}</div></section>`;
    if (S.research) h += `<section><h2><span>What the research says</span></h2><div class="research">
        <p>${esc(S.research.finding)}</p>${S.research.tie ? `<p>${esc(S.research.tie)}</p>` : ""}<div class="cite">${esc(S.research.cite)}</div></div></section>`;
    if (S.read) h += `<section><h2><span>Claude's read</span></h2><dl class="take">
        ${S.read.wentWell ? `<dt style="--c:var(--good)">Went well</dt><dd>${esc(S.read.wentWell)}</dd>` : ""}
        ${S.read.slipped ? `<dt style="--c:var(--warn)">Slipped</dt><dd>${esc(S.read.slipped)}</dd>` : ""}
        ${S.read.next ? `<dt style="--c:var(--k-build)">${esc(S.read.nextLabel || "Tomorrow")}</dt><dd>${esc(S.read.next)}</dd>` : ""}</dl></section>`;
  }
  h += `<section class="tasks"><h2><span>Where the time went</span></h2>` + groups.map(g =>
    `<div class="grp"><span>${AREAS[g.a]}</span><span>${dur(d.areaMin[g.a])}</span></div>` +
    g.top.map(r => { const t = threads[r.thread], k = kindOf(t);
      return `<div class="row"><span title="${esc(t.name)}">${esc(t.name)}<span class="sub">${KIND_LABEL[k].toLowerCase()}</span></span><span class="bar" style="--c:${kc(k)};width:${(r.min / maxMin * 100).toFixed(1)}%"></span><span class="t num">${dur(r.min)}</span></div>`; }).join("") +
    (g.rest.length ? `<div class="row"><span>${g.rest.length} smaller task${g.rest.length > 1 ? "s" : ""}</span><span class="bar" style="--c:var(--neutral);width:${(g.restMin / maxMin * 100).toFixed(1)}%"></span><span class="t num">${dur(g.restMin)}</span></div>` : "")
  ).join("") + `</section>`;
  const gen = new Date(DATA.generatedAt);
  h += `<footer>Updated ${esc(fmtDay(dayKey(DATA.generatedAt), { month: "short", day: "numeric" }))} at ${pad(gen.getHours())}:${pad(gen.getMinutes())}${fresh && S.nextCheckin ? ` · next check-in ${esc(S.nextCheckin)}` : ""} · window ${DEF.win} min, limit ${DEF.limit}</footer>`;
  out.innerHTML = h;
  drawTerrain(d);
}

// The day as one line, like the /morning brief: height = tasks in flight,
// clay where it runs above the limit, a dot where each task first came in
// (bigger = more time on it that day, grey = other).
function drawTerrain(d) {
  const svg = document.getElementById("terrain"), W = 760, top = 14, base = 118, H = 146;
  svg.setAttribute("viewBox", `0 0 ${W} ${H}`); svg.innerHTML = "";
  const m0 = Math.floor(d.first / 60) * 60, m1 = Math.max(Math.ceil((d.last + 1) / 60) * 60, m0 + 120), span = m1 - m0;
  const x = m => (m - m0) / span * W, yMax = Math.max(5, d.peak), y = c => base - c / yMax * (base - top);
  const level = m => { let s = 0, n = 0; for (let k = m - 4; k <= m + 4; k++) if (k >= 0 && k < 1440) { s += d.count[k]; n++; } return s / n; };
  const pts = []; for (let m = m0; m <= m1; m += 3) pts.push([x(m), y(level(m))]);
  let path = `M${pts[0][0].toFixed(1)},${pts[0][1].toFixed(1)}`;
  for (let i = 0; i < pts.length - 1; i++) {  // Catmull-Rom through the samples, as cubic Béziers
    const [p0, p1, p2, p3] = [pts[Math.max(i - 1, 0)], pts[i], pts[i + 1], pts[Math.min(i + 2, pts.length - 1)]];
    path += `C${(p1[0] + (p2[0] - p0[0]) / 6).toFixed(1)},${(p1[1] + (p2[1] - p0[1]) / 6).toFixed(1)} ${(p2[0] - (p3[0] - p1[0]) / 6).toFixed(1)},${(p2[1] - (p3[1] - p1[1]) / 6).toFixed(1)} ${p2[0].toFixed(1)},${p2[1].toFixed(1)}`;
  }
  const yl = y(d.limit + 0.3);
  el("line", { x1: 0, x2: W, y1: y(d.limit), y2: y(d.limit), stroke: "var(--faint)", "stroke-dasharray": "2 5", opacity: 0.7 }, svg);
  el("text", { x: W, y: y(d.limit) - 6, "text-anchor": "end" }, svg, `limit ${d.limit}`);
  const clip = el("clipPath", { id: "above" }, el("defs", {}, svg));
  el("rect", { x: 0, y: 0, width: W, height: yl }, clip);
  el("path", { d: path, fill: "none", stroke: "var(--ink)", "stroke-width": 1.6, "stroke-linejoin": "round", "stroke-linecap": "round" }, svg);
  el("path", { d: path, fill: "none", stroke: "var(--clay)", "stroke-width": 2.4, "stroke-linecap": "round", "clip-path": "url(#above)" }, svg);
  for (let h = m0; h <= m1; h += 60) {
    if (span > 600 && (h / 60) % 2) continue;
    el("text", { x: Math.min(Math.max(x(h), 14), W - 14), y: H - 4, "text-anchor": "middle" }, svg, hhmm(h));
  }
  const maxMin = Math.max(...Object.values(d.stats).map(s => s.min), 1);
  for (const t of d.order) {
    const s = d.stats[t], a = s.iv[0][0], th = threads[t], cx = x(a), cy = y(level(Math.round(a)));
    const c = el("circle", { cx, cy, r: (3.5 + 4.5 * Math.sqrt(s.min / maxMin)).toFixed(1), fill: areaOf(t) === "work" ? "var(--ink)" : "var(--faint)", stroke: "var(--bg)", "stroke-width": 1.5 }, svg);
    hover(c, `<b>${esc(th.name)}</b><br>first touched ${hhmm(a)} · ${dur(s.min)} this day`);
  }
}

// Up to three acts, cut at the day's two longest breaks (30 min or more).
function actsHtml(d) {
  const eng = []; for (let m = d.first; m <= d.last; m++) if (d.engaged[m]) eng.push(m);
  const gaps = eng.slice(1).map((m, i) => [m - eng[i], i + 1]).filter(([g]) => g >= 30).sort((a, b) => b[0] - a[0]).slice(0, 2).map(g => g[1]).sort((a, b) => a - b);
  const cuts = [0, ...gaps, eng.length];
  const acts = cuts.slice(0, -1).map((c, i) => {
    const ms = eng.slice(c, cuts[i + 1]), a = ms[0], b = ms[ms.length - 1] + 1;
    const over = ms.filter(m => d.count[m] > d.limit).length, peak = Math.max(...ms.map(m => d.count[m]));
    const per = {};
    for (const t of d.order) for (const [p, q] of d.stats[t].iv) { const o = Math.min(q, b) - Math.max(p, a); if (o > 0) per[t] = (per[t] || 0) + o; }
    const ts = Object.keys(per).sort((p, q) => per[q] - per[p]), lead = ts[0] ? threads[ts[0]].name : "";
    const what = ts.length === 1 ? `, all of it on ${esc(lead)}.` : ` across ${ts.length} tasks, most of it on ${esc(lead)}.`;
    const load = over ? `${dur(over)} ran above ${d.limit} at once, peaking at ${peak}.` : `Stayed at ${peak} or fewer at once.`;
    return `<div><b>${hhmm(a)} – ${hhmm(b)}</b>${dur(ms.length)} with agents${what} ${load}</div>`;
  });
  return `<div class="acts" style="--n:${acts.length}">${acts.join("")}</div>`;
}

// ---------- advanced ----------
const state = { win: store.get("win", DEF.win), limit: store.get("limit", DEF.limit), scope: store.get("scope", "all"), day: activeDays[activeDays.length - 1], all: false };

function renderStrip() {
  const svg = document.getElementById("strip"), W = 760, H = 96, slot = W / allDays.length, bw = Math.max(slot - 6, 2);
  svg.innerHTML = ""; svg.setAttribute("viewBox", `0 0 ${W} ${H + 20}`);
  document.getElementById("ndays").textContent = allDays.length;
  const days = allDays.map(k => byDay[k] ? getDay(k, state.win, state.limit, state.scope) : null);
  const max = Math.max(60, ...days.map(d => d ? d.engagedMin : 0));
  allDays.forEach((k, i) => {
    const d = days[i], x = i * slot + 3, dt = new Date(dayStart(k));
    if (d) {
      const hT = d.engagedMin / max * H, hO = d.overMin / max * H, g = el("g", { style: "cursor:pointer" }, svg);
      el("rect", { x, y: 0, width: bw, height: H, fill: "transparent" }, g);
      if (hT - hO > 0.5) el("rect", { x, y: H - hT, width: bw, height: Math.max(hT - hO - (hO ? 2 : 0), 0.5), rx: 2, fill: "var(--neutral)" }, g);
      if (hO > 0) el("rect", { x, y: H - hO, width: bw, height: hO, rx: 2, fill: "var(--bad)" }, g);
      if (k === state.day) el("rect", { x: x - 2.5, y: H - hT - 3, width: bw + 5, height: hT + 6, rx: 4, fill: "none", stroke: "var(--clay)", "stroke-width": 1.5 }, g);
      const v = verdictOf(d);
      hover(g, `<b>${esc(fmtDay(k, { weekday: "short", month: "short", day: "numeric" }))}</b><br>${dur(d.engagedMin)} engaged · ${d.order.length} tasks<br>${dur(d.overMin)} above ${state.limit} (${Math.round(v.share * 100)}%) · ${v.text}`);
      g.addEventListener("click", () => { state.day = k; renderAdvanced(); });
    } else el("rect", { x, y: H - 2, width: bw, height: 2, rx: 1, fill: "var(--line)" }, svg);
    if (dt.getDay() === 1) el("text", { x: x + bw / 2, y: H + 16, "text-anchor": "middle" }, svg, fmtDay(k, { month: "short", day: "numeric" }));
  });
}

function renderDay() {
  const d = getDay(state.day, state.win, state.limit, state.scope), v = verdictOf(d), i = activeDays.indexOf(state.day);
  document.getElementById("day-h").textContent = fmtDay(state.day);
  document.getElementById("prev").disabled = i <= 0;
  document.getElementById("next").disabled = i >= activeDays.length - 1;
  document.getElementById("day-verdict").innerHTML = `<i style="background:${v.color}"></i>${v.text}`;
  document.getElementById("day-kpis").innerHTML = kpiRow(d, v, state.limit);
  document.getElementById("day-areas").innerHTML = areaLine(d);

  const max = Math.max(...d.levels, 1);
  document.getElementById("levels").innerHTML = d.levels.map((m, i) => `<div class="lvrow"><span>${levelLabel(i)}</span>
    <span class="bar" style="width:${(m / max * 100).toFixed(1)}%;background:${levelColor(i + 1, state.limit)};opacity:${m ? 1 : 0}"></span>
    <span class="t num">${dur(m)} · ${Math.round(100 * m / Math.max(d.engagedMin, 1))}%</span></div>`).join("");
  renderChart(d);
}

function renderChart(d) {
  const svg = document.getElementById("chart"), LW = 190, W = 760, PW = W - LW;
  svg.innerHTML = "";
  const m0 = Math.max(0, Math.floor((d.first - 10) / 60) * 60), m1 = Math.min(1440, Math.ceil((d.last + 10) / 60) * 60), span = Math.max(m1 - m0, 60);
  const x = m => LW + (m - m0) / span * PW;
  const AH = 76, top = 8, yMax = Math.max(5, d.peak), y = c => top + AH - c / yMax * AH;
  const lanes = d.order, LH = 24, laneTop = top + AH + 24;
  const laneRows = [];  // work lanes first, then other, each under a small label when both show
  for (const a of Object.keys(AREAS)) {
    const ls = lanes.filter(t => areaOf(t) === a);
    if (!ls.length) continue;
    if (d.scope === "all") laneRows.push({ head: AREAS[a] });
    laneRows.push(...ls.map(t => ({ t })));
  }
  const H = laneTop + laneRows.length * LH + 22;
  svg.setAttribute("viewBox", `0 0 ${W} ${H}`);
  for (let h = m0; h <= m1; h += 60) {
    el("line", { x1: x(h), x2: x(h), y1: top, y2: H - 20, stroke: "var(--line)" }, svg);
    el("text", { x: x(h), y: H - 4, "text-anchor": "middle" }, svg, hhmm(h));
  }
  el("text", { x: LW - 12, y: top + 10, "text-anchor": "end" }, svg, "in flight");
  for (let m = m0; m < m1; m++) {
    const c = d.count[m]; if (!c) continue;
    let e = m; while (e + 1 < m1 && d.count[e + 1] === c) e++;
    el("rect", { x: x(m), y: y(c), width: x(e + 1) - x(m) + 0.3, height: top + AH - y(c), fill: c > d.limit ? "var(--bad)" : "var(--neutral)", opacity: c > d.limit ? 0.85 : 0.7 }, svg);
    m = e;
  }
  el("line", { x1: LW, x2: W, y1: y(d.limit), y2: y(d.limit), stroke: "var(--ink)", "stroke-dasharray": "3 4", opacity: 0.45 }, svg);
  el("text", { x: W, y: y(d.limit) - 5, "text-anchor": "end" }, svg, `limit ${d.limit}`);
  const hit = el("rect", { x: LW, y: top, width: PW, height: AH, fill: "transparent" }, svg);
  hover(hit, e => {
    const r = svg.getBoundingClientRect(), m = Math.floor(m0 + ((e.clientX - r.left) / r.width * W - LW) / PW * span);
    const open = lanes.filter(t => d.stats[t].iv.some(([a, b]) => a <= m + 1 && b >= m - d.win + 1));
    return `<b>${hhmm(m)}</b> · ${d.count[m] || 0} in flight` + open.map(t => `<br><span class="sw" style="--c:${kc(kindOf(threads[t]))}"></span>${esc(threads[t].name)}`).join("");
  });
  let n = 0;
  laneRows.forEach((row, i) => {
    const Y = laneTop + i * LH;
    if (row.head) { el("text", { x: 0, y: Y + 17, class: "grp-label" }, svg, row.head); return; }
    const t = row.t, th = threads[t], k = kindOf(th), s = d.stats[t];
    if (n++ % 2 === 0) el("rect", { x: 0, y: Y, width: W, height: LH, fill: "var(--wash)", opacity: 0.6 }, svg);
    const label = el("text", { x: 0, y: Y + 16, class: "lane" }, svg, th.name.length > 28 ? th.name.slice(0, 27) + "…" : th.name);
    el("title", {}, label, th.name);
    for (const [a, b] of s.iv) {
      const r = el("rect", { x: x(a), y: Y + 7, width: Math.max(x(b) - x(a), 2.5), height: 10, rx: 2, fill: kc(k) }, svg);
      hover(r, `<b>${esc(th.name)}</b><br>${hhmm(a)}–${hhmm(b)} · ${KIND_LABEL[k]} · ${dur(s.min)} this day`);
    }
  });
  const kinds = [...new Set(lanes.map(t => kindOf(threads[t])))];
  document.getElementById("kinds").innerHTML = Object.keys(KIND_LABEL).filter(k => kinds.includes(k)).map(k => `<span style="--c:${kc(k)}">${KIND_LABEL[k]}</span>`).join("") +
    `<span style="--c:var(--bad)">above limit</span>`;
}

function renderTable() {
  document.getElementById("tbl-day").setAttribute("aria-pressed", !state.all);
  document.getElementById("tbl-all").setAttribute("aria-pressed", state.all);
  const agg = {};
  for (const k of state.all ? activeDays : [state.day]) {
    const d = getDay(k, state.win, state.limit, state.scope);
    for (const s of Object.values(d.stats)) { const a = agg[s.thread] ||= { thread: s.thread, min: 0, visits: 0, days: 0 }; a.min += s.min; a.visits += s.visits; a.days++; }
  }
  const rows = Object.values(agg).sort((a, b) => (areaOf(a.thread) === "work" ? 0 : 1) - (areaOf(b.thread) === "work" ? 0 : 1) || b.min - a.min);
  document.getElementById("tbl").innerHTML = `<tr><th>Task</th><th>Area</th><th>Kind</th><th class="t">Time</th><th class="t">Visits</th>${state.all ? `<th class="t">Days</th>` : ""}<th class="t">Size</th></tr>` +
    rows.map(r => { const t = threads[r.thread], k = kindOf(t);
      return `<tr><td>${esc(t.name)}</td><td>${AREAS[areaOf(r.thread)]}</td><td><span class="dot" style="background:${kc(k)}"></span>${KIND_LABEL[k]}</td><td class="t num">${dur(r.min)}</td><td class="t num">${r.visits}</td>${state.all ? `<td class="t num">${r.days}</td>` : ""}<td class="t">${sizeOf(r.min)}</td></tr>`; }).join("");
}

function renderMethod() {
  document.getElementById("method").innerHTML = `<p>Each prompt you send counts as engaged time, from the agent's last reply (at most ${DATA.readCapMin} minutes back) to the moment you send it. The first prompt of a session counts as the time to write it.</p>
    <p>A task is in flight if you touched it in the last ${state.win} minutes. Time above the limit is engaged time while more than ${state.limit} tasks were in flight. When two tasks share a minute, each gets half of it.</p>
    <p>A hop is two prompts in a row sent to different tasks. A visit is one unbroken run of prompts on the same task. Sizes: Quick is under 10 minutes, Focused is 10 to 45, Deep is over 45.</p>
    <p>Work is anything in your work repos plus tasks you marked as work; everything else is other. The limit counts all tasks together, because switching from work to the thesis is still a switch. "Show" narrows the Advanced tab to one side.</p>
    <p>The Summary tab always uses a ${DEF.win}-minute window and a limit of ${DEF.limit}, so it matches what Claude wrote.</p>`;
}

function renderAdvanced() { renderStrip(); renderDay(); renderTable(); renderMethod(); }

// ---------- controls ----------
const winSel = document.getElementById("win"), limSel = document.getElementById("limit");
winSel.innerHTML = [10, 15, 20, 30, 45, 60, 90].map(v => `<option value="${v}">${v} min</option>`).join("");
limSel.innerHTML = [1, 2, 3, 4, 5].map(v => `<option value="${v}">${v} at once</option>`).join("");
winSel.value = state.win; limSel.value = state.limit;
winSel.onchange = () => { state.win = +winSel.value; store.set("win", state.win); renderAdvanced(); };
const scopeSel = document.getElementById("scope");
scopeSel.innerHTML = `<option value="all">all tasks</option><option value="work">work only</option><option value="other">other only</option>`;
scopeSel.value = state.scope;
scopeSel.onchange = () => { state.scope = scopeSel.value; store.set("scope", state.scope); renderAdvanced(); };
limSel.onchange = () => { state.limit = +limSel.value; store.set("limit", state.limit); renderAdvanced(); };
const step = dir => { const i = activeDays.indexOf(state.day) + dir; if (i >= 0 && i < activeDays.length) { state.day = activeDays[i]; renderAdvanced(); } };
document.getElementById("prev").onclick = () => step(-1);
document.getElementById("next").onclick = () => step(1);
document.getElementById("tbl-day").onclick = () => { state.all = false; renderTable(); };
document.getElementById("tbl-all").onclick = () => { state.all = true; renderTable(); };
document.addEventListener("keydown", e => {
  if (document.getElementById("advanced").hidden || e.target.tagName === "SELECT") return;
  if (e.key === "ArrowLeft") step(-1); if (e.key === "ArrowRight") step(1);
});

let advancedDrawn = false;
function showTab(name) {
  const adv = name === "advanced";
  document.getElementById("summary").hidden = adv;
  document.getElementById("advanced").hidden = !adv;
  document.getElementById("tab-summary").setAttribute("aria-selected", !adv);
  document.getElementById("tab-advanced").setAttribute("aria-selected", adv);
  if (adv && !advancedDrawn && state.day) { renderAdvanced(); advancedDrawn = true; }
  store.set("tab", name);
}
document.getElementById("tab-summary").onclick = () => showTab("summary");
document.getElementById("tab-advanced").onclick = () => showTab("advanced");

renderSummary();
showTab(store.get("tab", "summary"));
</script>
